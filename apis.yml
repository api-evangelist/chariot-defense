name: Chariot Defense
description: >-
  Chariot Defense is a San Francisco-area defense technology company building
  high-voltage, hybrid-electric power systems for the modern battlefield. Its
  AMPHORA family (the 24 VDC / 5 kW A24 and the 400 VDC / 35 kW A400) and the
  upcoming VANGUARD platform deliver quiet, high-density, transportable power
  that replaces loud, fuel-hungry diesel generators, cutting energy signature
  and fuel use while powering distributed systems such as drones, sensors,
  electronic warfare, command and control, additive manufacturing, and
  directed-energy weapons. Founded in 2022 by Adam Warmoth, the company has
  raised $41M (a $34M Series A led by Andreessen Horowitz plus an $8M seed) and
  its systems are fielded by the U.S. Army and the Defense Innovation Unit.
  This is a hardware/defense company profiled in the API Evangelist network; it
  publishes no public developer API, portal, or documentation.
